apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gestion-retours
  namespace: monitoring
data:
  gestion-retours-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "Backend up",
          "type": "timeseries",
          "targets": [
            {
              "expr": "up{job=\"backend\"}",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
        },
        {
          "title": "HTTP request rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"backend\",uri!~\"/actuator.*\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0}
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["backend", "spring"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "title": "Gestion Retours - Backend",
      "version": 1
    }
