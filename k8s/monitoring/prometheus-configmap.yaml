apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['backend.default.svc.cluster.local:8080']

  alerts.yml: |
    groups:
      - name: backend-alerts
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend service unavailable"
              description: "Le backend n'expose plus /actuator/prometheus depuis 1 minute."
