apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gestion-retours
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LaithMahdi/Mini-Project-Gestion-Retours.git
    targetRevision: prod
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
