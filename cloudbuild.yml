steps:
  - id: Build backend image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_SHORT_SHA}
      - -f
      - backend/dockerfile.prod
      - backend

  - id: Build frontend image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_SHORT_SHA}
      - -f
      - frontend/dockerfile.prod
      - frontend

  - id: Push backend image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_SHORT_SHA}

  - id: Push frontend image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_SHORT_SHA}

  - id: Deploy MySQL first
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin -qq
        gcloud container clusters get-credentials "${_GKE_CLUSTER}" --region "${_GKE_LOCATION}" --project "$PROJECT_ID"
        kubectl create namespace "${_K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/db-pvc.yaml
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/db-service.yaml
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/db-deployment.yaml
        kubectl rollout status deployment/mysql -n "${_K8S_NAMESPACE}" --timeout=10m

  - id: Deploy backend second
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin -qq
        gcloud container clusters get-credentials "${_GKE_CLUSTER}" --region "${_GKE_LOCATION}" --project "$PROJECT_ID"
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/backend-service.yaml
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/backend-deployment.yaml
        kubectl set image deployment/backend backend="${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_SHORT_SHA}" -n "${_K8S_NAMESPACE}"
        kubectl set env deployment/backend APP_CORS_ALLOWED_ORIGINS="${_FRONTEND_ORIGIN}" -n "${_K8S_NAMESPACE}"
        kubectl patch deployment backend -n "${_K8S_NAMESPACE}" --type='json' -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]'
        TARGET_IMAGE="${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_SHORT_SHA}"
        if ! kubectl rollout status deployment/backend -n "${_K8S_NAMESPACE}" --timeout=20m; then
          echo "Rollout status timed out. Checking effective state..."
          CURRENT_IMAGE=$$(kubectl get deployment/backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')
          UPDATED_REPLICAS=$$(kubectl get deployment/backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.updatedReplicas}')
          READY_REPLICAS=$$(kubectl get deployment/backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.readyReplicas}')

          if [[ "$${CURRENT_IMAGE}" == "$${TARGET_IMAGE}" && "$${UPDATED_REPLICAS:-0}" -ge 1 && "$${READY_REPLICAS:-0}" -ge 1 ]]; then
            echo "Backend is healthy with updated image despite rollout timeout. Continuing..."
          else
          echo "Backend rollout failed; dumping diagnostics..."
          kubectl get pods -n "${_K8S_NAMESPACE}" -o wide
          kubectl describe deployment/backend -n "${_K8S_NAMESPACE}"
          kubectl get events -n "${_K8S_NAMESPACE}" --sort-by='.lastTimestamp' | tail -n 50
          kubectl logs -n "${_K8S_NAMESPACE}" -l app=backend --all-containers=true --tail=200 || true
          exit 1
          fi
        fi

        # Wait for backend LoadBalancer external IP
        echo "Waiting for backend LoadBalancer external IP..."
        BACKEND_IP=""
        BACKEND_HOSTNAME=""
        for i in {1..30}; do
          BACKEND_IP=$$(kubectl get service backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          BACKEND_HOSTNAME=$$(kubectl get service backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [[ -n "$${BACKEND_IP}" || -n "$${BACKEND_HOSTNAME}" ]]; then
            break
          fi
          echo "Waiting for backend LoadBalancer external address... ($${i}/30)"
          sleep 10
        done

        if [[ -n "$${BACKEND_IP}" ]]; then
          echo "Backend external IP: $${BACKEND_IP}"
        elif [[ -n "$${BACKEND_HOSTNAME}" ]]; then
          echo "Backend external hostname: $${BACKEND_HOSTNAME}"
        else
          echo "WARNING: Backend external address not yet available. It may take a few more minutes."
        fi

  - id: Deploy frontend third
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin -qq
        gcloud container clusters get-credentials "${_GKE_CLUSTER}" --region "${_GKE_LOCATION}" --project "$PROJECT_ID"
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/frontend-service.yaml
        kubectl apply -n "${_K8S_NAMESPACE}" -f k8s/frontend-deployment.yaml
        kubectl set image deployment/frontend frontend="${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_SHORT_SHA}" -n "${_K8S_NAMESPACE}"
        kubectl set env deployment/frontend BACKEND_BASE_URL="http://backend:8080" NEXT_PUBLIC_BASE_URL_API="/api/v1" -n "${_K8S_NAMESPACE}"
        kubectl patch deployment frontend -n "${_K8S_NAMESPACE}" --type='json' -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}]'
        kubectl rollout status deployment/frontend -n "${_K8S_NAMESPACE}" --timeout=20m

        # ── Detect frontend external address ──
        FRONTEND_IP=""
        FRONTEND_HOSTNAME=""
        for i in {1..30}; do
          FRONTEND_IP=$$(kubectl get service frontend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          FRONTEND_HOSTNAME=$$(kubectl get service frontend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [[ -n "$${FRONTEND_IP}" || -n "$${FRONTEND_HOSTNAME}" ]]; then
            break
          fi
          echo "Waiting for frontend LoadBalancer external address... ($${i}/30)"
          sleep 10
        done

        DETECTED_FRONTEND_ORIGIN=""
        if [[ -n "$${FRONTEND_IP}" ]]; then
          DETECTED_FRONTEND_ORIGIN="http://$${FRONTEND_IP}:3000"
        elif [[ -n "$${FRONTEND_HOSTNAME}" ]]; then
          DETECTED_FRONTEND_ORIGIN="http://$${FRONTEND_HOSTNAME}:3000"
        fi

        # ── Detect backend external address ──
        BACKEND_IP=""
        BACKEND_HOSTNAME=""
        for i in {1..30}; do
          BACKEND_IP=$$(kubectl get service backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          BACKEND_HOSTNAME=$$(kubectl get service backend -n "${_K8S_NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [[ -n "$${BACKEND_IP}" || -n "$${BACKEND_HOSTNAME}" ]]; then
            break
          fi
          echo "Waiting for backend LoadBalancer external address... ($${i}/30)"
          sleep 10
        done

        DETECTED_BACKEND_ORIGIN=""
        if [[ -n "$${BACKEND_IP}" ]]; then
          DETECTED_BACKEND_ORIGIN="http://$${BACKEND_IP}:8080"
        elif [[ -n "$${BACKEND_HOSTNAME}" ]]; then
          DETECTED_BACKEND_ORIGIN="http://$${BACKEND_HOSTNAME}:8080"
        fi

        # ── Update backend CORS to allow detected frontend origin ──
        if [[ -n "$${DETECTED_FRONTEND_ORIGIN}" ]]; then
          CORS_ORIGINS="${_FRONTEND_ORIGIN},$${DETECTED_FRONTEND_ORIGIN}"
          echo "Updating backend CORS origins to: $${CORS_ORIGINS}"
          kubectl set env deployment/backend APP_CORS_ALLOWED_ORIGINS="$${CORS_ORIGINS}" -n "${_K8S_NAMESPACE}"
          kubectl rollout status deployment/backend -n "${_K8S_NAMESPACE}" --timeout=20m
        else
          echo "No frontend external address found yet; backend CORS remains: ${_FRONTEND_ORIGIN}"
        fi

        # ── Print both external endpoints ──
        echo ""
        echo "=============================================="
        echo "  DEPLOYMENT COMPLETE — EXTERNAL ENDPOINTS"
        echo "=============================================="
        echo ""
        if [[ -n "$${DETECTED_FRONTEND_ORIGIN}" ]]; then
          echo "  FRONTEND URL : $${DETECTED_FRONTEND_ORIGIN}"
        else
          echo "  FRONTEND URL : (pending — check 'kubectl get svc frontend -n ${_K8S_NAMESPACE}')"
        fi
        echo ""
        if [[ -n "$${DETECTED_BACKEND_ORIGIN}" ]]; then
          echo "  BACKEND URL  : $${DETECTED_BACKEND_ORIGIN}"
          echo "  SWAGGER UI   : $${DETECTED_BACKEND_ORIGIN}/swagger-ui.html"
        else
          echo "  BACKEND URL  : (pending — check 'kubectl get svc backend -n ${_K8S_NAMESPACE}')"
        fi
        echo ""
        echo "=============================================="
        echo ""

        kubectl get services -n "${_K8S_NAMESPACE}" -o wide

images:
  - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/backend:${_SHORT_SHA}
  - ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/frontend:${_SHORT_SHA}

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: gestion-retours
  _GKE_CLUSTER: gestion-retours-cluster
  _GKE_LOCATION: us-central1
  _K8S_NAMESPACE: production
  _FRONTEND_ORIGIN: http://34.28.110.10:3000
  _SHORT_SHA: ""

options:
  dynamic_substitutions: true

timeout: 3600s