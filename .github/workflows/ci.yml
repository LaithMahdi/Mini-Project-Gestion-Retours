name: CI

on:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

jobs:
  quality:
    name: Quality, Security, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20 (backend compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend compile
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Backend build
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend tests
        working-directory: frontend
        run: bun test

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Security code scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build backend Docker image
        run: docker build -t gestion-retours-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t gestion-retours-frontend:ci ./frontend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: gestion-retours-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: gestion-retours-frontend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-push:
    name: Docker Push (prod)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref_name == 'prod'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:prod

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:prod

  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [quality, docker-push]
    if: github.event_name == 'push' && github.ref_name == 'prod'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Pull and retag backend image from GHCR
        run: |
          docker pull ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          docker tag ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }} ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/backend:${{ github.sha }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/backend:${{ github.sha }}

      - name: Pull and retag frontend image from GHCR
        run: |
          docker pull ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
          docker tag ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }} ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/frontend:${{ github.sha }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/frontend:${{ github.sha }}

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gestion-retours-backend
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/backend:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gestion-retours-frontend
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gestion-retours/frontend:${{ github.sha }}
