name: CI

on:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

jobs:
  quality:
    name: Quality, Security, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend compile (lint équivalent)
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Backend build
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Security code scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Dependency scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build backend Docker image
        run: docker build -t gestion-retours-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t gestion-retours-frontend:ci ./frontend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gestion-retours-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gestion-retours-frontend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-push:
    name: Docker Push (main/dev)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
