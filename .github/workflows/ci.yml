name: CI

on:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

jobs:
  quality:
    name: Quality, Security, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node 20 (backend compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend compile
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Backend build
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend tests
        working-directory: frontend
        run: bun test

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Security code scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build backend Docker image
        run: docker build -t gestion-retours-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t gestion-retours-frontend:ci ./frontend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: gestion-retours-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: gestion-retours-frontend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  docker-push:
    name: Docker Push (prod)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref_name == 'prod'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:prod
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion-retours-backend:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion-retours-backend:prod

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:prod
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion-retours-frontend:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gestion-retours-frontend:prod

  google-cloud-deploy:
    name: Deploy to Google Cloud (prod)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref_name == 'prod'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Trigger Cloud Build deploy
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          gcloud builds submit \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --config cloudbuild.yml \
            --substitutions "_AR_HOSTNAME=${{ secrets.GCP_AR_HOSTNAME }},_AR_REPOSITORY=${{ secrets.GCP_ARTIFACT_REPOSITORY }},_GKE_CLUSTER=${{ secrets.GKE_CLUSTER }},_GKE_LOCATION=${{ secrets.GKE_LOCATION }},_K8S_NAMESPACE=${{ secrets.GKE_NAMESPACE }},_FRONTEND_ORIGIN=${{ secrets.GCP_FRONTEND_ORIGIN }},_SHORT_SHA=${SHORT_SHA}" \
            .