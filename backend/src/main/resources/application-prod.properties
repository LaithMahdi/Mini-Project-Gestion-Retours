# Production Configuration
spring.datasource.url=jdbc:mysql://prod-db-server:3306/gestion_retour?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration - Production URLs
app.cors.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Content-Type,Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600

